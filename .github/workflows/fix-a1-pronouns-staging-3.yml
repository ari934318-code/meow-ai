name: Fix A1 Lesson 3 staging

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'ari934318-code'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch lesson 3 stages and remove one-off workflow
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('lib/pages/a1_basics_lesson_page.dart')
          s = p.read_text(encoding='utf-8')

          pattern = re.compile(
              r"      case 'a1_03':.*?\n      case 'a1_04':",
              re.S,
          )

          replacement = """      case 'a1_03':
      case 'lesson_3':
      case '3':
        return [
          _stage(
            'Stage 1',
            'مرحله ۱',
            [0, 1, 2],
          ),
          _stage(
            'Stage 2',
            'مرحله ۲',
            [4, 6, 7, 9],
          ),
          _stage(
            'Stage 3',
            'مرحله ۳',
            [3, 5, 8],
          ),
          _stage(
            'Stage 4',
            'مرحله ۴',
            [10, 11],
          ),
          _stage(
            'Stage 5',
            'مرحله ۵',
            [12, 13, 14],
          ),
          _stage(
            'Stage 6',
            'مرحله ۶',
            [15, 16, 17, 18],
          ),
          _stage(
            'Stage 7',
            'مرحله ۷',
            [19, 20, 21, 22, 23],
          ),
          _stage(
            'Stage 8',
            'مرحله ۸',
            List.generate(
              9,
              (i) => i + 28,
            ),
          ),
          _stage(
            'Stage 9',
            'مرحله ۹',
            [24, 25, 26, 27],
          ),
          _speakingStage(
            'Speaking',
            'تمرین مکالمه',
          ),
        ];

      case 'a1_04':"""

          new_text, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('Lesson 3 stage block not found exactly once')

          p.write_text(new_text, encoding='utf-8')

          workflow = Path('.github/workflows/fix-a1-pronouns-staging-3.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/a1_basics_lesson_page.dart .github/workflows/fix-a1-pronouns-staging-3.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "fix: stage A1 have and has by taught concept"
          git push
