name: Fix A1 Lesson 5 staging

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Require a non-main branch
        shell: bash
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "::error::Run this workflow from a dedicated fix branch, not main."
            exit 1
          fi

      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Lesson 5 staging
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("lib/pages/a1_basics_lesson_page.dart")
          text = path.read_text(encoding="utf-8")

          replacement = r"""      case 'a1_05':
      case 'lesson_5':
      case '5':
        return [
          _stage(
            'Stage 1',
            'مرحله ۱',
            [0],
          ),
          _stage(
            'Stage 2',
            'مرحله ۲',
            [2, 7],
          ),
          _stage(
            'Stage 3',
            'مرحله ۳',
            [1, 3, 5, 9],
          ),
          _stage(
            'Stage 4',
            'مرحله ۴',
            [4, 8],
          ),
          _stage(
            'Stage 5',
            'مرحله ۵',
            [6],
          ),
          _stage(
            'Stage 6',
            'مرحله ۶',
            [10, 11],
          ),
          _stage(
            'Stage 7',
            'مرحله ۷',
            [12, 13, 14, 15, 16, 17],
          ),
          _stage(
            'Stage 8',
            'مرحله ۸',
            [18, 19, 20, 21, 22, 23],
          ),
          _stage(
            'Stage 9',
            'مرحله ۹',
            [24, 25, 26, 27, 28],
          ),
          _stage(
            'Stage 10',
            'مرحله ۱۰',
            List.generate(
              10,
              (i) => i + 29,
            ),
          ),
          _speakingStage(
            'Speaking',
            'تمرین مکالمه',
          ),
        ];

"""

          pattern = r"      case 'a1_05':.*?        ];\n\n      case 'a1_06':"
          new_text, count = re.subn(
              pattern,
              replacement + "      case 'a1_06':",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(
                  f"Expected exactly one Lesson 5 block, found {count}"
              )

          if new_text == text:
              raise SystemExit("Lesson 5 block was already unchanged; no commit needed.")

          path.write_text(new_text, encoding="utf-8")
          print("Lesson 5 staging patch applied.")
          PY

      - name: Verify patch and commit on this branch
        shell: bash
        run: |
          git diff --check
          git diff -- lib/pages/a1_basics_lesson_page.dart
          if git diff --quiet -- lib/pages/a1_basics_lesson_page.dart; then
            echo "No Lesson 5 changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/a1_basics_lesson_page.dart
          git commit -m "fix A1 Basics lesson 5 staging"
          git push origin "HEAD:${GITHUB_REF_NAME}"
