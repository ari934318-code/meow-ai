name: Validate A1 Lesson 5 staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Validate Lesson 5 staging block
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("lib/pages/a1_basics_lesson_page.dart")
          if not path.is_file():
              sys.exit("ERROR: Lesson page file was not found.")

          text = path.read_text(encoding="utf-8")
          start = text.find("      case 'a1_basic_05':")
          end = text.find("      case 'a1_basic_14':", start + 1)

          if start < 0:
              sys.exit("ERROR: case 'a1_basic_05' was not found.")
          if end < 0:
              sys.exit("ERROR: end of Lesson 5 block (case 'a1_basic_14') was not found.")

          block = text[start:end]
          required = [
              "case 'lesson_5':",
              "case '5':",
              "What Is the Present Simple?",
              "Real-Life Present Simple",
              "_listeningStage(",
              "_speakingStage(",
          ]
          missing = [item for item in required if item not in block]
          if missing:
              sys.exit("ERROR: Lesson 5 block is missing expected content: " + ", ".join(missing))

          if not re.search(r"List\.generate\(47,\s*\(i\)\s*=>\s*i\)", block):
              sys.exit("ERROR: Expected 47-question real-life practice stage was not found.")

          print("PASS: A1 Basics Lesson 5 staging block is present and structurally consistent.")
          print("This workflow validates only; it does not edit files, commit, push, or delete itself.")
          PY
