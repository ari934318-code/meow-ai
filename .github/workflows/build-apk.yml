name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/part1-foundation

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Setup Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/meow-upload-key.jks

          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=meow-upload-key.jks
          EOF

      - name: Build APK
        id: build_apk
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meow-ai-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: meow-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Fail if APK build failed
        if: steps.build_apk.outcome != 'success'
        run: |
          echo "APK build failed. Download the meow-ai-build-log artifact."
          exit 1