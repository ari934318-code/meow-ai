name: B1 Data Integrity Test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'test/b1_data_integrity_test.dart'
      - 'lib/data/levels/b1/**'
      - 'pubspec.yaml'
      - '.github/workflows/b1-data-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b1-data-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run B1 data integrity tests
        run: flutter test test/b1_data_integrity_test.dart
