name: Prepare A1 Lesson 6 staging patch

# This workflow used to run on every push to main, write directly to the
# checked-out branch, commit a source change, and delete itself. Keep the
# intended stage-map repair available for review, but never push or mutate main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the Lesson 6 stage-map patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/pages/a1_basics_lesson_page.dart')
          s = p.read_text()
          start = s.index("      case 'a1_06':")
          end = s.index("      case 'a1_07':", start)
          new_block = '''      case 'a1_06':
      case 'lesson_6':
      case '6':
        return [
          _stage('Stage 1', 'مرحله ۱', [0, 1]),
          _stage('Stage 2', 'مرحله ۲', [2, 3]),
          _stage('Stage 3', 'مرحله ۳', [4, 5]),
          _stage('Stage 4', 'مرحله ۴', [6, 7]),
          _stage('Stage 5', 'مرحله ۵', [8, 9]),
          _stage('Stage 6', 'مرحله ۶', [10, 11, 12, 13]),
          _stage('Stage 7', 'مرحله ۷', [14, 15, 16, 17, 18, 19]),
          _stage('Stage 8', 'مرحله ۸', [20, 21, 22, 23, 24]),
          _stage('Stage 9', 'مرحله ۹', [25, 26, 27, 28]),
          _stage('Stage 10', 'مرحله ۱۰', [29, 30, 31, 32, 33, 34]),
          _stage('Stage 11', 'مرحله ۱۱', [35, 36, 37, 38]),
          _stage('Stage 12', 'مرحله ۱۲', [39, 40, 41, 42, 43]),
          _speakingStage('Speaking', 'تمرین مکالمه'),
        ];

'''
          p.write_text(s[:start] + new_block + s[end:])
      - name: Export patch for review
        run: |
          git diff -- lib/pages/a1_basics_lesson_page.dart > a1-lesson6-staging.patch
          test -s a1-lesson6-staging.patch
      - uses: actions/upload-artifact@v4
        with:
          name: a1-lesson6-staging-patch
          path: a1-lesson6-staging.patch
