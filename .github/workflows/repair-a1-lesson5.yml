name: Repair A1 Lesson 5 staging

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'ari934318-code'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore page and patch lesson 5
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          p = Path('lib/pages/a1_basics_lesson_page.dart')

          # Restore the complete page from the known-good parent commit.
          restored = subprocess.check_output([
              'git', 'show', 'ffe7455b255447943eb0393e3b909de669c54bd3:lib/pages/a1_basics_lesson_page.dart'
          ], text=True)
          s = restored

          pattern = re.compile(
              r"      case 'a1_05':.*?\n      case 'a1_06':",
              re.S,
          )

          replacement = """      case 'a1_05':
      case 'lesson_5':
      case '5':
        return [
          _stage(
            'What Is a Regular Verb?',
            'فعل باقاعده چیست؟',
            [0],
          ),
          _stage(
            'Base Form',
            'شکل پایه فعل',
            [2, 7, 11],
          ),
          _stage(
            'I, You, We, They',
            'I، You، We، They',
            [0, 2, 7, 11],
          ),
          _stage(
            'He, She, It',
            'He، She، It',
            [1, 3, 5, 9],
          ),
          _stage(
            'Adding S',
            'اضافه کردن S',
            [1, 3, 5, 9, 10],
          ),
          _stage(
            'Adding ES',
            'اضافه کردن ES',
            [4, 8],
          ),
          _stage(
            'Verbs Ending in Y',
            'فعل‌هایی که به Y ختم می‌شوند',
            [6],
          ),
          _stage(
            'Vowel + Y',
            'حالت مصوت + Y',
            [],
          ),
          _stage(
            'Positive Sentences',
            'جمله‌های مثبت',
            [10, 11],
          ),
          _stage(
            'Negative Sentences',
            'جمله‌های منفی',
            [13, 16, 17, 23],
          ),
          _stage(
            'Questions',
            'سؤال‌ها',
            [12, 14, 15],
          ),
          _stage(
            'Positive vs Negative vs Question',
            'مثبت، منفی و سوالی',
            [18, 19, 20, 21, 22, 23],
          ),
          _stage(
            'Everyday Regular Verbs',
            'افعال باقاعده روزمره',
            [24, 25, 26, 27, 28],
          ),
          _stage(
            'Common Mistakes',
            'اشتباهات رایج',
            List.generate(
              10,
              (i) => i + 29,
            ),
          ),
          _speakingStage(
            'Speaking',
            'تمرین مکالمه',
          ),
        ];

      case 'a1_06':"""

          new_text, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('Lesson 5 block not found exactly once')

          p.write_text(new_text, encoding='utf-8')

          # Remove the temporary repair workflows after the real file is restored.
          for workflow in [
              Path('.github/workflows/repair-a1-lesson5.yml'),
              Path('.github/workflows/fix-a1-pronouns-staging-3.yml'),
          ]:
              if workflow.exists():
                  workflow.unlink()

      - name: Commit and push repaired page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/a1_basics_lesson_page.dart .github/workflows/repair-a1-lesson5.yml .github/workflows/fix-a1-pronouns-staging-3.yml
          git commit -m "fix: restore A1 basics page and stage regular verbs by concept"
          git push
