name: Backend validation

on:
  push:
    branches: [ feature/part1-foundation ]
  workflow_dispatch:

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          set -e
          pytest -q

      - name: Start FastAPI (uvicorn) in background
        run: |
          set -e
          nohup uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for server and check /api/health
        run: |
          set -e
          echo "Waiting for http://127.0.0.1:8000/api/health ..."
          for i in {1..15}; do
            if curl -sS -f http://127.0.0.1:8000/api/health; then
              echo "Health check succeeded"
              exit 0
            fi
            sleep 1
          done
          echo "Health check did not succeed after waiting" >&2
          cat uvicorn.log || true
          exit 1

      - name: Stop uvicorn
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then
            kill $(cat uvicorn.pid) || true
            rm -f uvicorn.pid
          fi
