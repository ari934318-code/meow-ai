name: Fix A1 Pronouns staging

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch lesson 1 stages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('lib/pages/a1_basics_lesson_page.dart')
          s = p.read_text(encoding='utf-8')
          pattern = r"      case 'a1_01':.*?\n      case 'a1_02':"
          replacement = '''      case 'a1_01':
      case 'lesson_1':
      case '1':
        return [
          _stage('Stage 1', 'مرحله ۱', [0, 16, 24]),
          _stage('Stage 2', 'مرحله ۲', [22, 31]),
          _stage('Stage 3', 'مرحله ۳', [2, 6, 11, 18, 33, 37]),
          _stage('Stage 4', 'مرحله ۴', [1, 7, 12, 17, 32, 38]),
          _stage('Stage 5', 'مرحله ۵', [3, 8, 13, 19, 28, 34, 40, 43, 46]),
          _stage('Stage 6', 'مرحله ۶', [5, 10, 14, 21, 29, 36, 41, 45]),
          _stage('Stage 7', 'مرحله ۷', [4, 9, 15, 20, 23, 30, 35, 39, 42, 44]),
          _speakingStage('Speaking', 'تمرین مکالمه'),
        ];

      case 'a1_02':'''
          ns, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Lesson 1 stage block not found')
          p.write_text(ns, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'Ari'
          git config user.email 'ari934318@gmail.com'
          git add lib/pages/a1_basics_lesson_page.dart
          git commit -m 'fix: stage A1 pronouns by taught concept'
          git push
