name: Diagnose A1 Lesson 11

on:
  workflow_dispatch:
    inputs:
      run_flutter_tests:
        description: "Run Flutter tests after checking the lesson mapping"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: diagnose-a1-lesson11
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable

      - name: Check A1 lesson 11 mapping (read-only)
        shell: bash
        run: |
          set -euo pipefail
          FILE="lib/pages/a1_basics_lesson_page.dart"
          test -f "$FILE"
          echo "Checking lesson 11 cases in $FILE"
          grep -n -A 42 -B 2 "case 'a1_basic_11':" "$FILE"
          if ! grep -q "case 'a1_basic_11':" "$FILE"; then
            echo "::error::Expected A1 Basics lesson ID a1_basic_11 was not found."
            exit 1
          fi
          if grep -q "case 'a1_11':" "$FILE"; then
            echo "::notice::Legacy a1_11 alias also exists; review ID compatibility."
          fi
          echo "Read-only check complete. No files were modified."

      - name: Install dependencies
        if: inputs.run_flutter_tests
        run: flutter pub get

      - name: Run Flutter tests
        if: inputs.run_flutter_tests
        run: flutter test
