name: Fix A1 Lesson 11 Staging

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix lesson 11 staging
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/pages/a1_basics_lesson_page.dart')
          text = path.read_text()

          start_marker = "case 'a1_11':"
          end_marker = "_speakingStage('Speaking','تمرین مکالمه'),"

          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)

          replacement = '''case 'a1_11':
          case 'lesson_11':
          case '11':
            return [
              _stage(
                'What Is the Present Simple?',
                'Present Simple چیست؟',
                [33],
              ),
              _stage(
                'I, You, We, They',
                'I, You, We, They',
                [0, 3, 5, 7, 10],
              ),
              _stage(
                'He, She, It',
                'He, She, It',
                [2, 4],
              ),
              _stage(
                'Adding -s',
                'اضافه کردن s',
                [8],
              ),
              _stage(
                'Adding -es',
                'اضافه کردن es',
                [6, 9, 11],
              ),
              _stage(
                'The -y to -ies Rule',
                'قانون تبدیل y به ies',
                [1, 27],
              ),
              _stage(
                'Positive Sentences',
                'جمله‌های مثبت',
                [24, 34],
              ),
              _stage(
                'Negative Sentences',
                'جمله‌های منفی',
                [12, 13, 14, 15, 26, 37],
              ),
              _stage(
                'Do and Does in Questions',
                'سؤال با Do و Does',
                [16, 17, 18, 19],
              ),
              _stage(
                'Common Mistakes',
                'اشتباهات رایج',
                [20, 21, 22, 23, 25, 35, 36],
              ),
              _stage(
                'Adverbs of Frequency',
                'قیدهای تکرار',
                [28, 29, 30, 31, 32],
              ),
              _stage(
                'Real-Life Present Simple',
                'Present Simple در انگلیسی واقعی',
                [38, 39, 40, 41, 42, 43, 44, 45, 46],
              ),
              _speakingStage('Speaking','تمرین مکالمه'),
            ];'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

      - name: Verify
        run: |
          grep -n -A95 "case 'a1_11':" lib/pages/a1_basics_lesson_page.dart

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/a1_basics_lesson_page.dart
          git diff --cached --check
          git commit -m "Fix A1 lesson 11 progressive staging"
          git push origin main

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-a1-lesson11-staging.yml
          git commit -m "Remove temporary lesson 11 fix workflow"
          git push origin main
